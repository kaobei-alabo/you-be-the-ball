name: Go tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  room-and-lan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - run: go run ./cmd/demo
      - working-directory: lan
        run: |
          go mod tidy
          go test -race ./...
          go build -o "$RUNNER_TEMP/you-be-the-ball" ./cmd/you-be-the-ball
